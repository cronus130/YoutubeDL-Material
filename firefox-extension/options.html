<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: 420px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 3px; }
    button.save { background: var(--accent); color: #fff; border: none; border-radius: 4px;
                  padding: 6px 14px; cursor: pointer; margin-top: 14px; font-size: 13px; }
  </style>
</head>
<body>
  <header><span class="title">YTDL-Material Capture</span></header>

  <label for="materialUrl">YTDL-Material URL</label>
  <input id="materialUrl" type="url" placeholder="http://192.168.1.10:8998">
  <div class="hint">Base URL only, no trailing path. Must be reachable from this browser.</div>

  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" autocomplete="off">
  <div class="hint">
    From Material: Settings &rarr; Advanced &rarr; enable "Use API key" and copy the generated key.
  </div>

  <button id="save" class="save">Save</button>
  <p id="status" class="status"></p>

  <script src="options.js"></script>
</body>
</html>

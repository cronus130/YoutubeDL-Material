# Builds this fork's image and pushes it to GitHub Container Registry.
#
# Differs from upstream's workflow in three ways, all deliberate:
#   * ghcr.io only. It authenticates with the automatic GITHUB_TOKEN, so there
#     are no registry secrets to create. The Docker Hub push (which needs an
#     account plus a token) is gone.
#   * linux/amd64 only. The target NAS is x86_64, and dropping the emulated arm64
#     and arm/v7 builds cuts CI from tens of minutes to a few.
#   * $GITHUB_OUTPUT instead of the deprecated ::set-output command.
#
# Deliberately NO schedule: trigger. GitHub marks any scheduled workflow in a
# fork as disabled_fork, and a disabled workflow does not run on *any* trigger -
# so a weekly-rebuild cron silently takes the push build down with it. Even after
# being enabled by hand, GitHub re-disables scheduled workflows after 60 days of
# repo inactivity, which would break deployment builds again with no warning. Use
# the Run workflow button for an on-demand base-image rebuild instead.
#
# First run only: GHCR packages are created private. Make the package public
# (Profile -> Packages -> youtubedl-material -> Package settings -> Change
# visibility) or the NAS will need a pull token. Forks also have Actions
# disabled by default - enable them on the repo's Actions tab.
name: docker

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
      - '.vscode/**'
      - 'chrome-extension/**'
      - 'releases/**'
      - 'synology-stack/**'
      - '**/**.md'
      - '**.crx'
      - '**.pem'
      - '.dockerignore'
      - '.gitignore'
  workflow_dispatch:

env:
  IMAGE_NAME: youtubedl-material
  IMAGE_TAG: nightly

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # The app reads this at runtime for its About dialog.
      - name: create-json
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "version.json"
          json: '{"type": "docker", "tag": "${{ env.IMAGE_TAG }}", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'

      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,${{ env.IMAGE_TAG }}-{{ date 'YYYY-MM-DD' }}
            type=raw,${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-,format=short

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
